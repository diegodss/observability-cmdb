name: observability-cmdb

# One service: the CMDB enrichment API, with the setup commands run inside it.
#
#   docker compose up -d                      start the API (http://localhost:8090, http://cmdb:8080 on the network)
#   curl http://localhost:8090/ci/EDW          enrich a CI
#   docker compose exec cmdb cmdb plan         setup/admin commands run inside the running service
#                                              (preflight, plan, apply, lookup, validate, ...)

services:
  cmdb:
    build: .
    image: observability-cmdb:local
    container_name: observability-cmdb
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./schemas:/srv/schemas:ro
      - ./data:/srv/data
    ports:
      - "127.0.0.1:${CMDB_HOST_PORT:-8090}:8080"

# Shared with observability-env-simulator and observability-platform, so Keep can call
# http://cmdb:8080. Any of the stacks can start first; the second logs a harmless
# "network was not created for project" warning.
networks:
  default:
    name: observability-sim
